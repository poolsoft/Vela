name: Build APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Yayinlama Kanali'
        type: choice
        required: true
        default: 'stable'
        options:
          - stable
          - canary
      force:
        description: 'Ayni kodda olsa bile yeniden derle'
        type: boolean
        default: false
      diagnostic:
        description: 'Debuggable diagnostic APK uret'
        type: boolean
        default: false
  push:
    branches: [ main, canary, codex/maplibre-10.3.7 ]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIAGNOSTIC_APK: ${{ inputs.diagnostic == true || github.ref == 'refs/heads/codex/maplibre-10.3.7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Strip machine-specific java.home for CI
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.VELA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vela-release.jks"
            echo "Decoded release keystore from secret."
          elif [ -f "app/signing/vela.jks" ]; then
            cp "app/signing/vela.jks" "$RUNNER_TEMP/vela-release.jks"
            echo "Using repository release keystore (app/signing/vela.jks)."
          fi

      - name: Fetch obf routing runtime jars
        run: |
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" \
              "https://github.com/${{ github.repository }}/releases/download/obf-runtime/$f" \
            || curl -fSL -o "core/libs/$f" \
              "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done
          test "$(stat -c%s core/libs/osmand-java.jar)" -gt 10000000
          test "$(stat -c%s core/libs/osmand-shared-jvm.jar)" -gt 1000000
          test "$(stat -c%s core/libs/gnu-trove-osmand.jar)" -gt 100000
          test "$(stat -c%s core/libs/kxml2-vela.jar)" -gt 10000

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Check translations
        run: python3 tools/check-translations.py

      - name: Derive build version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CH="${{ github.event.inputs.channel || 'stable' }}"
          else
            CH="canary"
          fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          if [ "$CH" = "stable" ]; then
            echo "name=0.4.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.4.${{ github.run_number }}-canary" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ env.DIAGNOSTIC_APK }}" = "true" ]; then
            echo "name=0.4.${{ github.run_number }}-diagnostic" >> "$GITHUB_OUTPUT"
          fi
          # Local head-unit diagnostics reached 2101; keep CI upgrades above those APKs.
          echo "code=$(( 2100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Fetch TTS runtime AAR
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/${{ github.repository }}/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar" \
          || curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/PimpinPumpkin/Vela/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar"
          test "$(stat -c%s app/libs/sherpa-onnx-1.13.3.aar)" -gt 50000000

      - name: Debug and Ensure NDK 27.0.12077973
        run: |
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          ls -la "$ANDROID_HOME/ndk" 2>/dev/null || echo "ndk alt klasoru henuz yok!"
          if [ ! -d "$ANDROID_HOME/ndk/27.0.12077973" ]; then
            echo "NDK 27.0.12077973 klasoru yok! sdkmanager ile kuruluyor..."
            yes | sdkmanager "ndk;27.0.12077973"
          fi
          echo "=== NDK 27 Icerigi ==="
          ls -la "$ANDROID_HOME/ndk/27.0.12077973" 2>/dev/null || echo "NDK 27 klasoru olusturulamadi!"
          STRIP_PATH="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -f "$STRIP_PATH" ]; then
            echo "llvm-strip bulundu: $STRIP_PATH"
            "$STRIP_PATH" --version
          else
            echo "UYARI: llvm-strip bulunamadi: $STRIP_PATH"
          fi

      - name: Build release APK
        env:
          VELA_KEYSTORE_PATH: ${{ runner.temp }}/vela-release.jks
          VELA_KEYSTORE_PASSWORD: ${{ secrets.VELA_KEYSTORE_PASSWORD || '178214ab' }}
          VELA_KEY_ALIAS: ${{ secrets.VELA_KEY_ALIAS || 'vela' }}
        run: >
          ./gradlew :app:assembleCarRelease --no-daemon --info
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}
          -PmaptilerKey=${{ secrets.MAPTILER_KEY }}
          -PdiagnosticApk=${{ env.DIAGNOSTIC_APK }}

      - name: Renderer boundary regression tests
        run: ./gradlew :app:testCarReleaseUnitTest --no-daemon -PdiagnosticApk=${{ env.DIAGNOSTIC_APK }}

      - name: Prepare APKs
        run: |
          VER="${{ steps.ver.outputs.name }}"
          CH="${{ steps.ver.outputs.channel }}"
          mkdir -p release-apks
          for apk in app/build/outputs/apk/car/release/*.apk; do
            [ -f "$apk" ] || continue
            bname=$(basename "$apk" .apk)
            arch=$(echo "$bname" | sed -e 's/app-car-//' -e 's/-release//')
            if [ "${{ env.DIAGNOSTIC_APK }}" = "true" ]; then
              prefix="vela-maps-diagnostic"
            elif [ "$CH" = "canary" ]; then
              prefix="vela-maps-canary"
            else
              prefix="vela-maps-v${VER}"
            fi
            if [ "$arch" = "universal" ] || [ "$arch" = "app-car-release" ]; then
              cp "$apk" "release-apks/${prefix}-universal.apk"
            else
              cp "$apk" "release-apks/${prefix}-${arch}.apk"
            fi
          done
          echo "Hazirlanan APK dosyalari:"
          ls -lh release-apks/

      - name: Verify diagnostic APK flag
        if: env.DIAGNOSTIC_APK == 'true'
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          for apk in release-apks/*.apk; do
            "$AAPT" dump badging "$apk" | grep -q '^application-debuggable'
          done

      - name: Inspect APK sizes and native libraries
        run: |
          for apk in release-apks/*.apk; do
            echo "----------------------------------------------------"
            echo "APK: $apk - Boyut: $(ls -lh "$apk" | awk '{print $5}')"
            unzip -l "$apk" | grep -E "(libvalhalla-wrapper\.so|libmaplibre\.so|libmapbox-gl\.so)" || true
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-maps-apk
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Publish diagnostic APKs
        if: env.DIAGNOSTIC_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_VERSION: ${{ steps.ver.outputs.name }}
          DIAGNOSTIC_CODE: ${{ steps.ver.outputs.code }}
        run: |
          TAG="diagnostic-${{ github.run_number }}"
          printf 'versionName: %s\nversionCode: %s\n\nRelease imzali, debugger acik tani APK. Harita hatasinda muzik/gosterge duzenine gecis, yerel harita onceligi ve renderer oturumunu koruma duzeltmeleri dahildir. Sesli komut ve TTS acilista otomatik baslatilmaz. Logcat uygulamanin erisim yetkisiyle logs klasorune kaydedilir.\n' "$DIAGNOSTIC_VERSION" "$DIAGNOSTIC_CODE" > "$RUNNER_TEMP/diagnostic-notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Vela $DIAGNOSTIC_VERSION (Tani)" \
              --notes-file "$RUNNER_TEMP/diagnostic-notes.md"
          fi
          gh release upload "$TAG" release-apks/*.apk --clobber

      - name: Publish Canary build (rolling release)
        if: env.DIAGNOSTIC_APK != 'true' && steps.ver.outputs.channel == 'canary' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          SUBJ="$(bash scripts/changelog.sh --latest HEAD 2>/dev/null || git log -1 --no-merges --pretty=%s)"
          [ -z "$SUBJ" ] && SUBJ="$(git log -1 --no-merges --pretty=%s)"
          NOTES="$(printf 'Canary branch.\n\nversionName: %s\nversionCode: %s\n\nLatest change: %s\n\nSplit APKs: arm64-v8a, armeabi-v7a, x86_64, universal\n' "$VER" "$CODE" "$SUBJ")"
          
          # Eski canary release'i temizle ve en basa yeni olustur
          gh release delete canary --yes --cleanup-tag 2>/dev/null || true
          gh release create canary \
            --title "Vela $VER" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --notes "$NOTES" \
            release-apks/*.apk

      - name: Publish Stable Release
        if: env.DIAGNOSTIC_APK != 'true' && steps.ver.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          SUBJ="$(bash scripts/changelog.sh --latest HEAD 2>/dev/null || git log -1 --no-merges --pretty=%s)"
          [ -z "$SUBJ" ] && SUBJ="$(git log -1 --no-merges --pretty=%s)"
          NOTES="$(printf 'Kararli Vela surumu.\n\nversionName: %s\nversionCode: %s\n\nLatest change: %s\n\nSplit APKs: arm64-v8a, armeabi-v7a, x86_64, universal\n' "$VER" "$CODE" "$SUBJ")"
          
          # Eger onceden ayni tag varsa temizle
          gh release delete "v${VER}" --yes --cleanup-tag 2>/dev/null || true
          
          # Kararli Latest Release olarak olustur
          gh release create "v${VER}" \
            --title "Vela $VER" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "$NOTES" \
            release-apks/*.apk
